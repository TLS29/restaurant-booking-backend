# Solo la DB (si quieres correr el backend local y solo la DB en Docker)
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: restaurant-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
