openapi: 3.0.0
info:
  title: Restaurant Booking API
  version: 1.0.0
  description: Multi-tenant restaurant reservation system API
  contact:
    name: API Support
    email: support@restaurantbooking.com

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Super Admin
    description: Super admin operations (create owners)
  - name: Owner
    description: Owner operations (manage own restaurants)
  - name: Admin
    description: Admin operations (manage restaurant staff)
  - name: Reservations
    description: Reservation management (coming soon)

paths:
  # Authentication endpoints
  /api/auth/register:
    $ref: './auth.yaml#/paths/~1api~1auth~1register'
  /api/auth/login:
    $ref: './auth.yaml#/paths/~1api~1auth~1login'

  # Super Admin endpoints
  /api/super-admin/owners:
    $ref: './superAdmin.yaml#/paths/~1api~1super-admin~1owners'
  /api/super-admin/owners/{id}:
    $ref: './superAdmin.yaml#/paths/~1api~1super-admin~1owners~1{id}'
  /api/super-admin/owners/{id}/deactivate:
    $ref: './superAdmin.yaml#/paths/~1api~1super-admin~1owners~1{id}~1deactivate'

  # Owner endpoints
  /api/owner/restaurants:
    $ref: './owner.yaml#/paths/~1api~1owner~1restaurants'
  /api/owner/restaurants/{id}:
    $ref: './owner.yaml#/paths/~1api~1owner~1restaurants~1{id}'
  /api/owner/restaurants/{id}/deactivate:
    $ref: './owner.yaml#/paths/~1api~1owner~1restaurants~1{id}~1deactivate'

  # Admin endpoints (Staff management)
  /api/admin/restaurants/{id}/staff:
    $ref: './admin.yaml#/paths/~1api~1admin~1restaurants~1{id}~1staff'
  /api/admin/restaurants/{id}/staff/{userId}:
    $ref: './admin.yaml#/paths/~1api~1admin~1restaurants~1{id}~1staff~1{userId}'

components:
  schemas:
    # Common schemas
    Error:
      $ref: './schemas/errors.yaml#/components/schemas/Error'
    ValidationError:
      $ref: './schemas/errors.yaml#/components/schemas/ValidationError'

    # Entity schemas
    User:
      $ref: './schemas/user.yaml#/components/schemas/User'
    RegisterRequest:
      $ref: './schemas/user.yaml#/components/schemas/RegisterRequest'
    LoginRequest:
      $ref: './schemas/user.yaml#/components/schemas/LoginRequest'
    AuthResponse:
      $ref: './schemas/user.yaml#/components/schemas/AuthResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests
